name: Persian layer still fits upstream?
# Runs the merge only -- no yarn install, no build -- so it is cheap. It answers one question:
# would `bin/update.sh <newest tag>` land cleanly, or does a hook point need attention?
# Enable `run_build` from the Run workflow form to also typecheck the merged tree.

on:
  schedule:
    - cron: "17 3 * * 1"       # Mondays, 03:17 UTC. GitHub disables scheduled workflows on a repo
                               # with no activity for 60 days -- a push, or touching this file,
                               # re-enables it.
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "grist-core ref to test against (tag or sha); empty = newest release tag"
        required: false
        default: ""
      run_build:
        description: "Also run yarn install + tsc on the merged tree"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Pick the upstream ref
        id: ref
        run: |
          ref="${{ github.event.inputs.upstream_ref }}"
          if [ -z "$ref" ]; then
            ref="$(git ls-remote --tags --refs https://github.com/gristlabs/grist-core.git \
                   | awk -F/ '{print $NF}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          fi
          if [ -z "$ref" ]; then
            echo "could not find any v*.*.* tag upstream" >&2
            exit 1
          fi
          echo "ref=$ref" | tee "$GITHUB_OUTPUT"

      - name: Merge the Persian layer onto ${{ steps.ref.outputs.ref }}
        env:
          WORK_DIR: ${{ github.workspace }}/../grist-core-merged
        run: |
          # update.sh is the one that decides: clobber when upstream stayed out of our files,
          # three-way merge when it did not. It exits 2 when the merge conflicts.
          set +e
          bin/update.sh "${{ steps.ref.outputs.ref }}" > /tmp/update.log 2>&1
          rc=$?
          set -e
          { echo "## update.sh (rc=$rc)"; echo '```'; tail -60 /tmp/update.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          { echo "## verify (merge mode)"; echo '```'; bin/verify.sh "$WORK_DIR" merge || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            { echo "### conflicts: these files need a human"; \
              git -C "$WORK_DIR" ls-files -u | awk '{print $4}' | sort -u; } >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi

      - name: Typecheck the merged tree
        if: ${{ github.event.inputs.run_build == 'true' }}
        working-directory: ../grist-core-merged
        run: |
          echo 'export const VERSION: string = "grist-core-fa";' > app/common/version.ts
          npx --yes yarn@1.22.22 install --frozen-lockfile --ignore-scripts --ignore-engines
          # The project has no tsc:prod script; build the app project the way the docs do it.
          node_modules/.bin/tsc --build tsconfig-prod.json

      - name: Report what upstream changed in our files
        if: always()
        env:
          WORK_DIR: ${{ github.workspace }}/../grist-core-merged
        run: |
          base="$(sed -n 's/^UPSTREAM_SHA=//p' UPSTREAM.lock)"
          echo "upstream commits touching our files since $base:"
          git -C "$WORK_DIR" log --oneline "$base..${{ steps.ref.outputs.ref }}" -- \
            $(tr -d '\r' < patch/modified-files.txt | grep -v '^[[:space:]]*$') | head -40
