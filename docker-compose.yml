# اجرای ایمیجی که bin/docker-build.sh ساخته.
#   ./bin/docker-build.sh     # merge + docker build (یک‌بار، و بعد از هر آپدیت)
#   docker compose up -d      # بالا آوردن
#   docker compose logs -f    # لاگ (کلید ورود/"BOOT KEY" بار اول همین‌جا چاپ می‌شود)
#
# چرا اینجا `build:` نداریم: داکرفایلِ خودِ grist-core یک build-context به نام `ext` می‌خواهد
# (بالادستی هم در .github/workflows/docker.yml همان را می‌دهد) و فقط bin/docker-build.sh و CI
# آن را می‌سازند. پس بیلد را به compose نسپارید: `docker compose up -d --build` کار نمی‌کند.
#
# همهٔ داده‌ها در volume به نام grist-fa-persist می‌ماند؛ حذف کانتینر چیزی را پاک نمی‌کند.
name: grist-fa

services:
  grist:
    image: ${GRIST_FA_IMAGE:-grist-core-fa:latest}
    restart: unless-stopped
    ports:
      - "8484:8484"
    volumes:
      - grist-fa-persist:/persist
    environment:
      # یک رشتهٔ تصادفی و بلند بگذارید (مثلاً خروجی `openssl rand -base64 24`). اگر عوضش کنید،
      # همهٔ نشست‌های باز می‌افتند — پس یک‌بار بگذارید و فراموشش کنید.
      GRIST_SESSION_SECRET: ${GRIST_SESSION_SECRET:-change-me-please}
      # دلخواه: کلید پنل /admin را خودتان انتخاب کنید؛ اگر ست نشود، Grist بار اول یک کلید
      # تصادفی در لاگ چاپ می‌کند.  GRIST_BOOT_KEY: my-secret-boot-key
      # دلخواه: رد کردن مرحلهٔ «ایجاد حساب» در نصب تازه.  GRIST_IN_SERVICE: "true"

volumes:
  grist-fa-persist: {}
